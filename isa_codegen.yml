# isa_codegen.yml - sdd.os ISA 配置檔案
# 專案：AI-Genesis
# 技術棧：Next.js Server Actions + Supabase + PostgreSQL
# 基於 14 個 Feature Files + 28 項決議

# ============================================================
# Instructions 定義
# ============================================================

instructions:
  # ============================================
  # Given 步驟 - 資料準備
  # ============================================

  - name: Entity setup
    format: ^準備一個(?P<entity>[\u4e00-\u9fffa-zA-Z0-9]+), with table:$
    step_type: Given
    executor:
      type: plugin
      plugin_python_path: /Users/eric/Desktop/sdd.os/src/sdd_os/features/executors/typescript/backend/setup/codegen/candidates/supabase_setup/executor.py
    constraints:
      - <entity> must be a valid entity defined in entity_to_table_mapping.yml
      - All column headers in the DataTable must be valid schema fields
      - Entity names supported: 用戶, 專案, 對話, 生成記錄, 部署記錄, Supabase組織, 技能, 任務, 任務步驟, 技能執行記錄, LLM呼叫記錄, Webhook配置, 通知
    subpackage: given
    situation: to prepare test data in the database before Server Action calls

  # ============================================
  # When 步驟 - Server Action 呼叫
  # ============================================

  - name: Action call
    format: ^(?P<summary>.+?), call table:$
    step_type: When
    executor:
      type: plugin
      plugin_python_path: /Users/eric/Desktop/sdd.os/src/sdd_os/features/executors/typescript/backend/action_call/codegen/candidates/cucumberjs_server_action/executor.py
    constraints:
      - <summary> must match an action summary in spec/actions/actions.yml
      - Supported summaries: 建立專案, 發送訊息, 生成程式碼, 部署專案, 迭代修改, 取消訂閱, 導出資料, 移轉資源, 建立任務, 確認計劃, 取消任務, 重試任務, 註冊技能, 配置Webhook
    subpackage: action
    situation: to invoke the Server Action with the given parameters

  # ============================================
  # Then 步驟 - 成功回應驗證
  # ============================================

  - name: Action success validation
    format: ^(?P<summary>.+?)成功,?\s*with table:$
    step_type: Then
    executor:
      type: skip
    # Note: linter removed - this project uses Server Actions, not REST API
    constraints:
      - <summary> must match the When step's summary
      - DataTable columns must match the action's output schema
    subpackage: then
    situation: to validate the Server Action success response using table

  # ============================================
  # Then 步驟 - 操作失敗
  # ============================================

  - name: Operation failure
    format: ^操作失敗$
    step_type: Then
    executor:
      type: skip
    subpackage: then
    situation: to validate that the Server Action returned an error

  # ============================================
  # Then 步驟 - Entity 驗證
  # ============================================

  - name: Entity validate
    format: ^存在一個(?P<entity>[\u4e00-\u9fffa-zA-Z0-9]+), with table:$
    step_type: Then
    executor:
      type: plugin
      plugin_python_path: /Users/eric/Desktop/sdd.os/src/sdd_os/features/executors/typescript/backend/validator/codegen/candidates/supabase_entity/executor.py
    constraints:
      - <entity> must be a valid entity defined in entity_to_table_mapping.yml
      - the entity's properties defined in the DataTable must match the entity spec
      - All column headers in the DataTable must be valid schema structure paths
      - Entity names supported: 用戶, 專案, 對話, 生成記錄, 部署記錄, Supabase組織, 技能, 任務, 任務步驟, 技能執行記錄, LLM呼叫記錄, Webhook配置, 通知
    subpackage: then
    situation: to validate the entity in the database with the given parameters

# ============================================================
# 專案配置
# ============================================================

project:
  name: AI-Genesis
  spec_path: spec/
  features_path: spec/features/
  actions_path: spec/actions/
  schema_path: spec/data/schema.sql
  entity_mapping_path: spec/data/entity_to_table_mapping.yml

# ============================================================
# Entity 與 Table 對應（從 entity_to_table_mapping.yml）
# ============================================================

entity_mappings:
  # 原始 Entities
  用戶: users
  專案: projects
  對話: conversations
  生成記錄: generations
  部署記錄: deployments
  Supabase組織: supabase_organizations
  # Orchestrator Entities（決議 #22-28）
  技能: skills
  任務: tasks
  任務步驟: task_steps
  技能執行記錄: skill_executions
  LLM呼叫記錄: llm_calls
  Webhook配置: user_webhooks
  通知: notifications

# ============================================================
# Action Summary 與函數對應（從 actions.yml）
# ============================================================

action_mappings:
  # 原始 Actions
  建立專案: createProject
  發送訊息: sendMessage
  生成程式碼: generateCode
  部署專案: deployProject
  迭代修改: updateProject
  取消訂閱: cancelSubscription
  導出資料: exportData
  移轉資源: transferResources
  # Orchestrator Actions（決議 #22-28）
  建立任務: createTask
  確認計劃: confirmTaskPlan
  取消任務: cancelTask
  重試任務: retryTask
  註冊技能: registerSkill
  配置Webhook: configureWebhook

# ============================================================
# 測試程式碼生成配置
# ============================================================

codegen:
  output_dir: src/tests/features/
  language: typescript
  test_framework: cucumber-js
  database_client: supabase-js
  server_actions_path: app/actions/
