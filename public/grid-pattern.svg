<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#e5e5e5" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#d4d4d4"/>
    </pattern>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#fade)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#dots)" opacity="0.5"/>

  <!-- Subtle geometric accents -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#e5e5e5" stroke-width="1" opacity="0.6"/>
  <circle cx="1000" cy="600" r="200" fill="none" stroke="#e5e5e5" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="400" x2="400" y2="0" stroke="#ebebeb" stroke-width="1" opacity="0.5"/>
  <line x1="800" y1="800" x2="1200" y2="400" stroke="#ebebeb" stroke-width="1" opacity="0.5"/>

  <!-- Abstract shapes -->
  <rect x="100" y="500" width="80" height="80" fill="none" stroke="#d4d4d4" stroke-width="1" transform="rotate(15 140 540)" opacity="0.3"/>
  <rect x="950" y="150" width="100" height="100" fill="none" stroke="#d4d4d4" stroke-width="1" transform="rotate(-10 1000 200)" opacity="0.3"/>
</svg>
