# spec/actions/actions.yml
# Server Actions 規格定義
# 基於 14 個 Feature Files + 28 項決議

project:
  name: AI-Genesis
  description: 基於 BDD Feature Files 設計的 Server Actions
  version: 1.0.0
  framework: next.js
  database: supabase

# ============================================================
# Actions 定義
# ============================================================

actions:
  # ----------------------------------------------------------
  # 1. 建立專案
  # ----------------------------------------------------------
  - name: createProject
    summary: 建立專案
    description: |
      建立一個新的網站專案。

      ## 關聯的業務規則
      - 前置：用戶訂閱狀態必須為 active
      - 前置：專案數量不可超過方案上限
      - 後置：專案名稱重複時自動加後綴

    featureFile: spec/features/建立專案.feature
    rules:
      - rule: 前置 - 用戶訂閱狀態必須為 active
        step: "Then 操作失敗"
      - rule: 前置 - 專案數量不可超過方案上限
        step: "Then 操作失敗"
      - rule: 後置 - 專案名稱重複時自動加後綴
        step: "Then 建立專案成功, with table:"

    input:
      type: CreateProjectInput
      properties:
        userId:
          type: string
          format: uuid
          description: 用戶 ID
          required: true
        name:
          type: string
          description: 專案名稱
          required: true
        description:
          type: string
          description: 專案描述
          required: false

    output:
      success:
        type: CreateProjectOutput
        properties:
          projectId:
            type: string
            format: uuid
          status:
            type: string
            enum: [draft]
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 2. 發送訊息
  # ----------------------------------------------------------
  - name: sendMessage
    summary: 發送訊息
    description: |
      在專案對話中發送訊息，與 AI 互動進行需求釐清。
      對話次數於訂閱週期重置。

      ## 關聯的業務規則
      - 前置：對話次數不可超過方案上限
      - 後置：每則用戶訊息消耗 1 次對話配額

    featureFile: spec/features/發送訊息.feature
    rules:
      - rule: 前置 - 對話次數不可超過方案上限
        step: "Then 操作失敗"
      - rule: 後置 - 每則用戶訊息消耗 1 次對話配額
        step: "Then 發送訊息成功, with table:"

    input:
      type: SendMessageInput
      properties:
        conversationId:
          type: string
          format: uuid
          description: 對話 ID
          required: true
        content:
          type: string
          description: 訊息內容
          required: true

    output:
      success:
        type: SendMessageOutput
        properties:
          messageId:
            type: string
            format: uuid
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 3. 生成程式碼
  # ----------------------------------------------------------
  - name: generateCode
    summary: 生成程式碼
    description: |
      根據已完成的 BDD Spec 生成專案程式碼。
      系統自動重試最多 3 次（自癒機制）。

      ## 關聯的業務規則
      - 前置：必須有對話且 BDD Spec 已完成
      - 後置：生成成功後專案狀態變為 testing
      - 後置：自癒機制最多嘗試 3 次
      - 後置：3 次失敗後標記為 failed 並通知用戶

    featureFile: spec/features/生成程式碼.feature
    rules:
      - rule: 前置 - 必須有對話且 BDD Spec 已完成
        step: "Then 操作失敗"
      - rule: 後置 - 生成成功後專案狀態變為 testing
        step: "Then 生成程式碼成功, with table:"
      - rule: 後置 - 自癒機制最多嘗試 3 次
        step: "Then 生成程式碼成功, with table:"
      - rule: 後置 - 3 次失敗後標記為 failed 並通知用戶
        step: "Then 操作失敗"

    input:
      type: GenerateCodeInput
      properties:
        projectId:
          type: string
          format: uuid
          description: 專案 ID
          required: true

    output:
      success:
        type: GenerateCodeOutput
        properties:
          generationId:
            type: string
            format: uuid
          status:
            type: string
            enum: [pending, running, success, failed]
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 4. 部署專案
  # ----------------------------------------------------------
  - name: deployProject
    summary: 部署專案
    description: |
      將已通過測試的專案部署到 Vercel + Supabase。
      主 Org 配額用盡時自動切換備用 Org。

      ## 關聯的業務規則
      - 前置：專案狀態必須為 testing
      - 後置：部署成功後專案狀態變為 deployed
      - 後置：主 Org 配額用盡時自動切換備用 Org
      - 後置：所有 Org 配額用盡時通知營運團隊

    featureFile: spec/features/部署專案.feature
    rules:
      - rule: 前置 - 專案狀態必須為 testing
        step: "Then 操作失敗"
      - rule: 後置 - 部署成功後專案狀態變為 deployed
        step: "Then 部署專案成功, with table:"
      - rule: 後置 - 主 Org 配額用盡時自動切換備用 Org
        step: "Then 部署專案成功, with table:"
      - rule: 後置 - 所有 Org 配額用盡時通知營運團隊
        step: "Then 部署專案成功, with table:"

    input:
      type: DeployProjectInput
      properties:
        projectId:
          type: string
          format: uuid
          description: 專案 ID
          required: true

    output:
      success:
        type: DeployProjectOutput
        properties:
          deploymentId:
            type: string
            format: uuid
          url:
            type: string
            format: uri
          status:
            type: string
            enum: [pending, deploying, success, failed]
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 5. 迭代修改
  # ----------------------------------------------------------
  - name: updateProject
    summary: 迭代修改
    description: |
      對已部署或失敗的專案進行修改，重新進入生成流程。
      破壞性變更前會自動備份資料。

      ## 關聯的業務規則
      - 前置：專案狀態必須為 deployed 或 failed
      - 後置：破壞性變更前自動備份資料
      - 後置：嘗試自動轉換資料類型，失敗才警告

    featureFile: spec/features/迭代修改.feature
    rules:
      - rule: 前置 - 專案狀態必須為 deployed 或 failed
        step: "Then 操作失敗"
      - rule: 後置 - 破壞性變更前自動備份資料
        step: "Then 迭代修改成功, with table:"
      - rule: 後置 - 嘗試自動轉換資料類型，失敗才警告
        step: "Then 迭代修改成功, with table:"

    input:
      type: UpdateProjectInput
      properties:
        projectId:
          type: string
          format: uuid
          description: 專案 ID
          required: true
        changes:
          type: string
          description: 變更描述
          required: true
        isDestructive:
          type: boolean
          description: 是否為破壞性變更
          required: false
          default: false

    output:
      success:
        type: UpdateProjectOutput
        properties:
          projectId:
            type: string
            format: uuid
          status:
            type: string
            enum: [generating]
          backupCreated:
            type: boolean
          dataConverted:
            type: boolean
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 6. 取消訂閱
  # ----------------------------------------------------------
  - name: cancelSubscription
    summary: 取消訂閱
    description: |
      取消用戶訂閱，進入 30 天暫停期。
      暫停期內可重新訂閱恢復。

      ## 關聯的業務規則
      - 後置：取消後訂閱狀態變為 suspended
      - 後置：網站完全停用，顯示暫停頁
      - 後置：暫停期內可重新訂閱恢復

    featureFile: spec/features/取消訂閱.feature
    rules:
      - rule: 後置 - 取消後訂閱狀態變為 suspended
        step: "Then 取消訂閱成功, with table:"
      - rule: 後置 - 網站完全停用，顯示暫停頁
        step: "Then 取消訂閱成功, with table:"
      - rule: 後置 - 暫停期內可重新訂閱恢復
        step: "Then 取消訂閱成功, with table:"

    input:
      type: CancelSubscriptionInput
      properties:
        userId:
          type: string
          format: uuid
          description: 用戶 ID
          required: true
        action:
          type: string
          enum: [cancel, resubscribe]
          description: 操作類型
          required: false
          default: cancel

    output:
      success:
        type: CancelSubscriptionOutput
        properties:
          userId:
            type: string
            format: uuid
          status:
            type: string
            enum: [active, suspended, cancelled]
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 7. 導出資料
  # ----------------------------------------------------------
  - name: exportData
    summary: 導出資料
    description: |
      導出專案資料為 SQL dump 格式。
      暫停期內仍可導出資料。

      ## 關聯的業務規則
      - 前置：僅專案擁有者可導出
      - 前置：暫停期內可導出資料
      - 後置：導出格式為 SQL dump

    featureFile: spec/features/導出資料.feature
    rules:
      - rule: 前置 - 僅專案擁有者可導出
        step: "Then 操作失敗"
      - rule: 前置 - 暫停期內可導出資料
        step: "Then 導出資料成功, with table:"
      - rule: 後置 - 導出格式為 SQL dump
        step: "Then 導出資料成功, with table:"

    input:
      type: ExportDataInput
      properties:
        projectId:
          type: string
          format: uuid
          description: 專案 ID
          required: true
        requestUserId:
          type: string
          format: uuid
          description: 請求者 ID（用於權限驗證）
          required: false

    output:
      success:
        type: ExportDataOutput
        properties:
          downloadUrl:
            type: string
            format: uri
          format:
            type: string
            enum: [sql_dump]
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 8. 移轉資源
  # ----------------------------------------------------------
  - name: transferResources
    summary: 移轉資源
    description: |
      將專案資源移轉到用戶自有的 Supabase/Vercel 帳號。
      自助操作，用戶需提供 API Key。

      ## 關聯的業務規則
      - 前置：訂閱狀態必須為 active
      - 前置：已移轉的專案不可再次移轉
      - 前置：API Key 必須有效
      - 後置：自助移轉完成

    featureFile: spec/features/移轉資源.feature
    rules:
      - rule: 前置 - 訂閱狀態必須為 active
        step: "Then 操作失敗"
      - rule: 前置 - 已移轉的專案不可再次移轉
        step: "Then 操作失敗"
      - rule: 前置 - API Key 必須有效
        step: "Then 操作失敗"
      - rule: 後置 - 自助移轉完成
        step: "Then 移轉資源成功, with table:"

    input:
      type: TransferResourcesInput
      properties:
        projectId:
          type: string
          format: uuid
          description: 專案 ID
          required: true
        supabaseApiKey:
          type: string
          description: 用戶的 Supabase API Key
          required: true
        vercelToken:
          type: string
          description: 用戶的 Vercel Token
          required: true

    output:
      success:
        type: TransferResourcesOutput
        properties:
          projectId:
            type: string
            format: uuid
          transferred:
            type: boolean
      error:
        type: ActionError

  # ==========================================================
  # Orchestrator Actions（決議 #22-28）
  # ==========================================================

  # ----------------------------------------------------------
  # 9. 建立任務
  # ----------------------------------------------------------
  - name: createTask
    summary: 建立任務
    description: |
      為專案建立執行任務，由系統自動規劃執行步驟。
      任務建立後進入 planning 狀態，等待規劃完成。

      ## 關聯的業務規則
      - 前置：專案狀態必須為 deployed
      - 後置：任務建立後自動開始規劃
      - 後置：任務屬於專案（決議 #22）

    featureFile: spec/features/建立任務.feature
    rules:
      - rule: 前置 - 專案狀態必須為 deployed
        step: "Then 操作失敗"
      - rule: 後置 - 任務建立後自動開始規劃
        step: "Then 建立任務成功, with table:"

    input:
      type: CreateTaskInput
      properties:
        projectId:
          type: string
          format: uuid
          description: 專案 ID
          required: true
        goal:
          type: string
          description: 任務目標描述
          required: true

    output:
      success:
        type: CreateTaskOutput
        properties:
          taskId:
            type: string
            format: uuid
          status:
            type: string
            enum: [planning]
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 10. 確認計劃
  # ----------------------------------------------------------
  - name: confirmTaskPlan
    summary: 確認計劃
    description: |
      確認或拒絕任務執行計劃。
      確認後任務開始執行，拒絕則取消任務。

      ## 關聯的業務規則
      - 前置：任務狀態必須為 pending_approval
      - 前置：僅任務擁有者可確認
      - 後置：確認後任務開始執行
      - 後置：拒絕計劃時任務取消

    featureFile: spec/features/確認計劃.feature
    rules:
      - rule: 前置 - 任務狀態必須為 pending_approval
        step: "Then 操作失敗"
      - rule: 前置 - 僅任務擁有者可確認
        step: "Then 操作失敗"
      - rule: 後置 - 確認後任務開始執行
        step: "Then 確認計劃成功, with table:"
      - rule: 後置 - 拒絕計劃時任務取消
        step: "Then 確認計劃成功, with table:"

    input:
      type: ConfirmTaskPlanInput
      properties:
        taskId:
          type: string
          format: uuid
          description: 任務 ID
          required: true
        approved:
          type: boolean
          description: 是否批准執行計劃
          required: true
        requestUserId:
          type: string
          format: uuid
          description: 請求者 ID（用於權限驗證）
          required: false

    output:
      success:
        type: ConfirmTaskPlanOutput
        properties:
          taskId:
            type: string
            format: uuid
          status:
            type: string
            enum: [executing, cancelled]
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 11. 取消任務
  # ----------------------------------------------------------
  - name: cancelTask
    summary: 取消任務
    description: |
      取消執行中的任務，保留已完成步驟的結果。
      取消後發送通知（決議 #28）。

      ## 關聯的業務規則
      - 前置：已完成或已取消的任務無法再取消
      - 後置：取消任務，保留已完成步驟（決議 #23）
      - 後置：取消時發送通知（決議 #28）

    featureFile: spec/features/取消任務.feature
    rules:
      - rule: 前置 - 已完成或已取消的任務無法再取消
        step: "Then 操作失敗"
      - rule: 後置 - 取消任務，保留已完成步驟（決議 #23）
        step: "Then 取消任務成功, with table:"
      - rule: 後置 - 取消時發送通知（決議 #28）
        step: "Then 取消任務成功, with table:"

    input:
      type: CancelTaskInput
      properties:
        taskId:
          type: string
          format: uuid
          description: 任務 ID
          required: true

    output:
      success:
        type: CancelTaskOutput
        properties:
          taskId:
            type: string
            format: uuid
          status:
            type: string
            enum: [cancelled]
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 12. 重試任務
  # ----------------------------------------------------------
  - name: retryTask
    summary: 重試任務
    description: |
      從失敗點重試任務，不重跑已完成步驟（決議 #23）。
      僅 failed 狀態的任務可重試。

      ## 關聯的業務規則
      - 前置：只有 failed 狀態的任務可重試
      - 後置：從失敗點重試，不重跑已完成步驟（決議 #23）

    featureFile: spec/features/重試任務.feature
    rules:
      - rule: 前置 - 只有 failed 狀態的任務可重試
        step: "Then 操作失敗"
      - rule: 後置 - 從失敗點重試，不重跑已完成步驟（決議 #23）
        step: "Then 重試任務成功, with table:"

    input:
      type: RetryTaskInput
      properties:
        taskId:
          type: string
          format: uuid
          description: 任務 ID
          required: true

    output:
      success:
        type: RetryTaskOutput
        properties:
          taskId:
            type: string
            format: uuid
          status:
            type: string
            enum: [executing]
          currentStep:
            type: integer
            description: 從哪個步驟開始重試
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 13. 註冊技能
  # ----------------------------------------------------------
  - name: registerSkill
    summary: 註冊技能
    description: |
      註冊新的 AI 技能到系統中。
      系統管理功能，僅管理員可操作。

      ## 關聯的業務規則
      - 前置：技能名稱不可重複
      - 後置：成功註冊新技能
      - 後置：自動生成描述的 embedding 向量

    featureFile: spec/features/註冊技能.feature
    rules:
      - rule: 前置 - 技能名稱不可重複
        step: "Then 操作失敗"
      - rule: 後置 - 成功註冊新技能
        step: "Then 註冊技能成功, with table:"
      - rule: 後置 - 自動生成描述的 embedding 向量
        step: "Then 註冊技能成功, with table:"

    input:
      type: RegisterSkillInput
      properties:
        name:
          type: string
          description: 技能唯一識別名稱
          required: true
        displayName:
          type: string
          description: 顯示名稱
          required: true
        description:
          type: string
          description: 技能描述（用於 embedding 計算）
          required: true
        minPlan:
          type: string
          enum: [free, creator, pro, business]
          description: 最低方案需求
          required: false
          default: free
        costLevel:
          type: string
          enum: [low, medium, high]
          description: 成本等級
          required: false
          default: medium
        timeoutMs:
          type: integer
          description: 執行超時時間（毫秒）
          required: false
          default: 300000

    output:
      success:
        type: RegisterSkillOutput
        properties:
          skillId:
            type: string
            format: uuid
          name:
            type: string
          status:
            type: string
            enum: [enabled]
          hasEmbedding:
            type: boolean
      error:
        type: ActionError

  # ----------------------------------------------------------
  # 14. 配置Webhook
  # ----------------------------------------------------------
  - name: configureWebhook
    summary: 配置Webhook
    description: |
      配置用戶的 Webhook 通知端點（決議 #28）。
      支援新增、更新、停用操作。

      ## 關聯的業務規則
      - 前置：URL 必須是有效的 HTTPS
      - 後置：成功配置 Webhook（決議 #28）
      - 後置：更新已存在的 Webhook
      - 後置：停用 Webhook

    featureFile: spec/features/配置Webhook.feature
    rules:
      - rule: 前置 - URL 必須是有效的 HTTPS
        step: "Then 操作失敗"
      - rule: 後置 - 成功配置 Webhook（決議 #28）
        step: "Then 配置Webhook成功, with table:"
      - rule: 後置 - 更新已存在的 Webhook
        step: "Then 配置Webhook成功, with table:"
      - rule: 後置 - 停用 Webhook
        step: "Then 配置Webhook成功, with table:"

    input:
      type: ConfigureWebhookInput
      properties:
        userId:
          type: string
          format: uuid
          description: 用戶 ID（新增時必填）
          required: false
        webhookId:
          type: string
          format: uuid
          description: Webhook ID（更新/停用時必填）
          required: false
        url:
          type: string
          format: uri
          description: Webhook URL（必須是 HTTPS）
          required: false
        events:
          type: string
          description: 訂閱的事件類型（逗號分隔）
          required: false
        isActive:
          type: boolean
          description: 是否啟用
          required: false

    output:
      success:
        type: ConfigureWebhookOutput
        properties:
          webhookId:
            type: string
            format: uuid
          url:
            type: string
            format: uri
          isActive:
            type: boolean
      error:
        type: ActionError

# ============================================================
# Types 定義（對應 spec/data/schema.sql）
# ============================================================

types:
  # ----------------------------------------------------------
  # Entity Types
  # ----------------------------------------------------------
  User:
    description: 平台用戶（對應 users 表）
    properties:
      id:
        type: string
