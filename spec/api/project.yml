# Tellcraft Project API
# SpecFormula BDD 自動化測試用

openapi: "3.0.0"
info:
  title: Tellcraft Project API
  version: "1.0.0"

paths:
  /api/projects:
    get:
      summary: 取得專案列表
      operationId: listProjects
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 專案列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
                        status:
                          type: string
                        vercelUrl:
                          type: string
                        customDomain:
                          type: string
                        isPinned:
                          type: boolean
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer

    post:
      summary: 建立專案
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: 專案建立成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  project:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      status:
                        type: string
        "403":
          description: 專案數量已達上限

  /api/projects/{id}:
    get:
      summary: 取得專案
      operationId: getProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 專案資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      description:
                        type: string
                      status:
                        type: string
                      vercelUrl:
                        type: string
                      customDomain:
                        type: string
                  conversation:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      messages:
                        type: array
                        items:
                          type: object
                      spec_complete:
                        type: boolean
        "404":
          description: 專案不存在

    patch:
      summary: 更新專案
      operationId: updateProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

    delete:
      summary: 刪除專案
      operationId: deleteProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/projects/{id}/pin:
    post:
      summary: 釘選專案
      operationId: pinProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 釘選切換成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  isPinned:
                    type: boolean

  /api/projects/{id}/versions:
    get:
      summary: 取得專案版本
      operationId: getProjectVersions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        versionNumber:
                          type: integer
                        versionLabel:
                          type: string
                        status:
                          type: string
                        changeSummary:
                          type: string
                        conversationId:
                          type: string
                          format: uuid
                        createdAt:
                          type: string
                        hasBackup:
                          type: boolean

  /api/projects/{id}/files:
    get:
      summary: 取得專案檔案
      operationId: getProjectFiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: skill_source
          in: query
          required: false
          schema:
            type: string
            description: "Filter by source: uiux, code, merge"
      responses:
        "200":
          description: 檔案列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        filePath:
                          type: string
                        skillSource:
                          type: string
                        fileType:
                          type: string
                        content:
                          type: string
                        description:
                          type: string
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  total:
                    type: integer
