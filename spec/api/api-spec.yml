# Tellcraft API Spec (OpenAPI 3.0)
# SpecFormula 用於 BDD 自動化測試

openapi: "3.0.0"
info:
  title: Tellcraft API
  version: "1.0.0"
  description: Tellcraft Platform API

paths:
  /api/conversations/{id}/message:
    post:
      summary: 發送訊息
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
      responses:
        "200":
          description: 訊息發送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string
                    format: uuid
                  status:
                    type: string

  /api/session/initialize:
    post:
      summary: 建立對話
      operationId: initializeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: 對話建立成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId:
                    type: string
                    format: uuid
                  projectId:
                    type: string
                    format: uuid

  /api/projects/{id}:
    get:
      summary: 取得專案
      operationId: getProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 專案資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  status:
                    type: string
        "404":
          description: 專案不存在
