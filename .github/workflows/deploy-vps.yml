name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  check:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tellcraft-backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tellcraft-backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Pre-commit checks (防雷清單守衛)
        run: bash ../scripts/pre-commit-checks.sh
      - run: pnpm typecheck
      - run: pnpm test:ci

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Decode SSH Key
        run: |
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ubuntu@18.179.205.105 << 'ENDSSH'
          echo "=========================================="
          echo "Starting VPS deployment..."
          echo "=========================================="

          # 確保 nvm 可用（非互動式 shell 防禦）
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm use 22 || nvm install 22
          echo "Node version: $(node -v)"

          cd ~/tellcraft-repo

          # 拉取最新代碼（含 submodule，例如 awesome-design-md）
          echo "Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main
          git submodule sync --recursive
          git submodule update --init --recursive

          # 檢查 backend 是否有變更需要重建
          cd tellcraft-backend

          # 安裝依賴（如果 package.json 有變更）
          echo "Installing dependencies..."
          pnpm install --frozen-lockfile

          # 重新編譯 TypeScript
          echo "Building TypeScript..."
          pnpm build

          # 首次部署時 PM2 進程名可能從 tellcraft-backend 改為 tellcraft-api + tellcraft-worker
          # 先刪除舊進程（如果存在），再用新 ecosystem.config.js 啟動
          echo "Reloading PM2..."
          pm2 delete tellcraft-backend 2>/dev/null || true
          pm2 startOrReload ecosystem.config.js --wait-ready

          # 顯示狀態
          echo "=========================================="
          echo "Deployment complete!"
          pm2 status
          echo "=========================================="
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f /tmp/ssh_key
