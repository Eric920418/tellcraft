name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  check:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tellcraft-backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tellcraft-backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:ci

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode SSH Key
        run: |
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ubuntu@54.238.4.117 << 'ENDSSH'
          echo "=========================================="
          echo "Starting VPS deployment..."
          echo "=========================================="

          cd ~/tellcraft-repo

          # 拉取最新代碼
          echo "Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          # 檢查 backend 是否有變更需要重建
          cd tellcraft-backend

          # 安裝依賴（如果 package.json 有變更）
          echo "Installing dependencies..."
          pnpm install --frozen-lockfile

          # 重新編譯 TypeScript
          echo "Building TypeScript..."
          pnpm build

          # 零停機熱更新（重新讀 ecosystem.config.js，新進程就緒後再關舊進程）
          echo "Reloading PM2..."
          pm2 reload ecosystem.config.js --only tellcraft-backend --wait-ready

          # 顯示狀態
          echo "=========================================="
          echo "Deployment complete!"
          pm2 status
          echo "=========================================="
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f /tmp/ssh_key
