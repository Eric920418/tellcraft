name: 架構重構提案
description: 提出架構重構方案（不增加新功能、不改變行為，僅優化架構設計）
title: "[REFACTOR] "
labels: ["refactoring", "architecture"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感謝您提出架構重構提案！此類型 Issue 專注於改善程式碼架構、提升可維護性，但不改變現有功能行為。

  - type: input
    id: adr-title
    attributes:
      label: 提案標題
      description: 簡短描述此重構提案的重點
      placeholder: 例如：統一 ISA YAML 的 $ref/include 機制
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: 描述此提案是針對哪一個部分的功能或架構設計做出重構？
      placeholder: |
        例如：
        - 目前哪個模組/組件需要重構
        - 這個部分在系統中扮演什麼角色
        - 目前的實作方式概述
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 在此 Context 下遇到了什麼問題？為何需要重構？
      placeholder: |
        例如：
        - 程式碼重複性高，維護困難
        - 職責不清楚，違反 SOLID 原則
        - 測試困難或覆蓋率低
        - 效能瓶頸
        - 技術債累積
    validations:
      required: true

  - type: textarea
    id: forces
    attributes:
      label: Forces（約束條件）
      description: 條列出在提出重構方案時必須考量的約束、非功能性需求（NFR）
      placeholder: |
        例如：
        1. 必須保持向後相容性
        2. 不能改變對外的 API 行為
        3. 需要保持現有測試的通過
        4. 效能不能明顯下降
        5. 重構過程需要可分階段進行
    validations:
      required: true

  - type: textarea
    id: solution-summary
    attributes:
      label: 解法摘要
      description: 簡單描述此重構方案大致上的解法是什麼
      placeholder: |
        例如：
        - 將 X 功能抽取為獨立的 Y 模組
        - 引入 Z 設計模式來改善職責分離
        - 重新組織檔案結構為...
    validations:
      required: true

  - type: textarea
    id: solution-design
    attributes:
      label: 解法設計
      description: 詳細描述重構方案的設計細節、實作步驟
      placeholder: |
        例如：
        ## 架構調整
        - 調整前：...
        - 調整後：...
        
        ## 實作步驟
        1. 第一步：...
        2. 第二步：...
        
        ## 關鍵變更點
        - 檔案 A：...
        - 模組 B：...
    validations:
      required: true

  - type: textarea
    id: pros
    attributes:
      label: Pros（優點）
      description: 描述此重構方案實施後的優點與改善
      placeholder: |
        例如：
        - 提升程式碼可讀性
        - 降低模組間耦合度
        - 簡化測試撰寫
        - 提升效能 X%
        - 便於未來擴展 Y 功能
    validations:
      required: true

  - type: textarea
    id: cons
    attributes:
      label: Cons（缺點/風險）
      description: 描述此方案實施後可能面臨的新約束、假設條件或潛在風險
      placeholder: |
        例如：
        - 需要額外的學習成本
        - 增加了檔案數量
        - 假設未來需求保持 X 方向，若改變則需重新調整
        - 重構期間可能影響 Y 功能的開發
    validations:
      required: true

  - type: textarea
    id: migration-plan
    attributes:
      label: 遷移計畫（可選）
      description: 如何從現有架構遷移到新架構？是否需要分階段進行？
      placeholder: |
        例如：
        ## 階段一：準備期
        - 新增新介面，保留舊介面
        
        ## 階段二：遷移期
        - 逐步將現有程式碼遷移到新架構
        
        ## 階段三：清理期
        - 移除舊介面和相關程式碼
    validations:
      required: false

  - type: checkboxes
    id: impact-scope
    attributes:
      label: 影響範圍
      description: 此重構會影響哪些方面？
      options:
        - label: 核心邏輯架構
        - label: API 介面（保持行為不變）
        - label: 測試程式碼
        - label: 配置檔案格式
        - label: 文件需要更新
        - label: 需要資料庫遷移
        - label: 效能特性

  - type: textarea
    id: additional-context
    attributes:
      label: 其他說明
      description: 任何其他相關資訊、參考資料、圖表或例子
      placeholder: |
        例如：
        - UML 圖表連結
        - 參考的設計模式或最佳實踐
        - 相關的 ADR 文件
        - 類似的開源專案實作
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        
        **注意事項**：
        - 此提案建立後，建議經過團隊討論與審核
        - 若有其他替代方案的討論，可在 Issue 留言區補充
        - 重構實施前請確保有足夠的測試覆蓋率
        - 請務必確認不會改變現有功能的對外行為
