# =============================================================================
# BDD Spec Skill 可調參數模板
# =============================================================================
# 說明：此檔案定義所有可由使用者調整的參數。
# Skill 在執行時會讀取此檔案，將參數注入到各 Instruction 中。
# 使用者可依專案規模與需求調整各項數值。
# =============================================================================

# -----------------------------------------------------------------------------
# Event Storming 探索階段 (00-event-storming 用)
# -----------------------------------------------------------------------------

# DFS 澄清策略 — 每批同時深入處理的 Command / Read Model 數量
# 值越小，每次澄清越深入但輪數越多；值越大，效率越高但複雜度上升
DFS_BANDWIDTH: 1

# Commands + Read Models 的總數上限
# 確保後續 Formulation 階段能有效處理所有項目
MAX_ES_ITEMS: 20

# -----------------------------------------------------------------------------
# 所有階段共用
# -----------------------------------------------------------------------------

# 每回合最多提問數（Sub-question 不計入）
MAX_QUESTIONS_PER_ROUND: 10

# 批量確認的題數間隔（Clarify 階段的 Staging Area 每幾題做一次確認）
BATCH_CONFIRM_INTERVAL: 5

# -----------------------------------------------------------------------------
# 檔案路徑配置
# -----------------------------------------------------------------------------

# 所有規格產出物的根目錄
SPECS_ROOT_DIR: spec

# Event Storming 規格檔案路徑（00-event-storming 的產出，01-discovery 的輸入）
ES_SPEC_PATH: ${SPECS_ROOT_DIR}/es.md

# Feature 檔案的存放目錄
FEATURE_SPECS_DIR: ${SPECS_ROOT_DIR}/features

# 資料模型檔案的存放目錄
DATA_SPECS_DIR: ${SPECS_ROOT_DIR}/data

# Actions 規格的存放目錄
ACTIONS_SPECS_DIR: ${SPECS_ROOT_DIR}/actions

# 釐清項目根目錄
CLARIFY_DIR: .clarify

# -----------------------------------------------------------------------------
# Discovery 階段 (01-discovery 用)
# -----------------------------------------------------------------------------

# Discovery 掃描模式：
# - "full" : 完整掃描所有檢查項（A1-D2）
# - "focused" : 僅掃描與 ES 新增/變更項目相關的檢查項
DISCOVERY_SCAN_MODE: full

# -----------------------------------------------------------------------------
# Formulation 階段 (03-formulation 用)
# -----------------------------------------------------------------------------

# 是否啟用草稿批量生成模式
# 當 ES 項目已 clear 時，一次性生成所有產出物初版草稿
ENABLE_DRAFT_BATCH_MODE: true

# 草稿批量生成的最大項目數（超過此數量時分批生成）
MAX_DRAFT_BATCH_SIZE: 10

