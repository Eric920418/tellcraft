# DataSource: managed by specformula-testcontainer (reads isa.yml)

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Spring SQL init (schema executed by specformula-testcontainer)
spring.sql.init.mode=never

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# JWT
jwt.secret=my-super-secret-key-for-todo-list-app-at-least-256-bits-long
jwt.expiration-ms=3600000
