                          type: integer
                          description: 申請編號
                          example: 1
                        agentId:
                          type: integer
                          description: 特務編號
                          example: 2
                        agentName:
                          type: string
                          description: 特務名稱
                          example: "Alice"
                        agentEmail:
                          type: string
                          description: 特務電子郵件
                          example: "alice@company.com"
                        overtimeType:
                          type: string
                          description: 加班類型
                          example: "WEEKDAY_OVERTIME"
                        overtimeDate:
                          type: integer
                          format: int64
                          description: 加班日期（毫秒時間戳記，台灣時區 UTC+8）
                          example: 1731168000000
                        startTime:
                          type: string
                          format: time
                          description: 開始時間（HH:mm:ss 格式）
                          example: "18:00:00"
                        endTime:
                          type: string
                          format: time
                          description: 結束時間（HH:mm:ss 格式）
                          example: "20:00:00"
                        reason:
                          type: string
                          description: 加班事由
                          example: "專案趕工"
                        status:
                          type: string
                          description: 申請狀態
                          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
                          example: "PENDING"
                        approvedBy:
                          type: integer
