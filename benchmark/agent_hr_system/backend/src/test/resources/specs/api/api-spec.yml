  /attendance/overtime:
    post:
      summary: 申請加班
      description: |
        特務提交加班申請，支援三種加班類型（符合台灣勞基法）
        
        **加班類型說明**：
        - WEEKDAY_OVERTIME: 平日延長工時（前 2 小時 1.34 倍，第 3 小時起 1.67 倍）
        - REST_DAY_OVERTIME: 休息日出勤（前 2 小時 1.34 倍，3-8 小時 1.67 倍，第 9 小時起 2.67 倍）
        - LEGAL_HOLIDAY_OVERTIME: 例假日/國定假日出勤（2 倍工資，需補假）
        
        **工時整合**：申請時不檢查打卡衝突，審核通過後系統會自動在 punch_records 表新增對應的 IN/OUT 打卡記錄，加班時數透過打卡記錄自然計入工時統計
      operationId: submitOvertimeRequest
      tags:
        - Overtime Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agentId
                - overtimeType
                - overtimeDate
                - startTime
                - endTime
              properties:
                agentId:
                  type: integer
                  description: 特務識別碼
                  example: 1
                overtimeType:
                  type: string
                  description: 加班類型
                  enum:
                    [
                      WEEKDAY_OVERTIME,
                      REST_DAY_OVERTIME,
                      LEGAL_HOLIDAY_OVERTIME,
                    ]
                  example: "WEEKDAY_OVERTIME"
                overtimeDate:
                  type: integer
                  format: int64
                  description: 加班日期（毫秒時間戳記，台灣時區 UTC+8）
                  example: 1731168000000
                startTime:
                  type: string
                  format: time
                  description: 開始時間（HH:mm:ss 格式）
                  example: "18:00:00"
                endTime:
                  type: string
                  format: time
                  description: 結束時間（HH:mm:ss 格式）
                  example: "20:00:00"
                reason:
                  type: string
                  description: 加班事由
                  example: "專案趕工"
      responses:
        "200":
          description: 申請成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: integer
                    description: 申請編號
                    example: 1
                  status:
                    type: string
                    description: 申請狀態
                    enum: [PENDING, APPROVED, REJECTED, CANCELLED]
                    example: "PENDING"
                  message:
                    type: string
                    description: 訊息
                    example: "加班申請已提交，待主管核准"
        "400":
          description: 申請失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 錯誤訊息
                    example: "該時段有打卡記錄，無法申請加班"

  /leave-requests/{requestId}/review:
    post:
      summary: 審核請假申請
      description: |
        主管審核下屬的請假申請（批准或拒絕）
        
        **權限說明**：僅主管身份可使用此功能，只能審核直屬下屬的 PENDING 狀態請假
        **批准檢查**：批准前需檢查請假時段內不能有打卡記錄
        **拒絕規則**：拒絕請假時不檢查打卡記錄
      operationId: reviewLeaveRequest
      tags:
        - Leave Management
        - Manager Functions
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
          description: 請假申請編號
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT]
                  description: 審核動作（APPROVE=批准，REJECT=拒絕）
                  example: "APPROVE"
                notes:
                  type: string
                  description: 審核備註（選填）
                  example: "同意休假"
      responses:
        "200":
          description: 審核成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: integer
                    description: 申請編號
                    example: 1
                  status:
                    type: string
                    description: 審核後狀態
                    enum: [APPROVED, REJECTED]
                    example: "APPROVED"
                  message:
                    type: string
                    description: 訊息
                    example: "請假申請已批准"
        "400":
          description: 審核失敗（業務規則違反）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 錯誤訊息
                    example: "請假時段內有打卡記錄，無法批准"
        "401":
          description: 未授權（JWT Token 無效或過期）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 錯誤訊息
                    example: "未授權，請重新登入"
        "403":
          description: 權限不足（非主管身份或非直屬下屬或非 PENDING 狀態）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 錯誤訊息
                    example: "權限不足，僅能審核直屬下屬的待審核申請"
        "404":
          description: 請假申請不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 錯誤訊息
                    example: "請假申請不存在"

  /managers/{managerId}/subordinates/overtime-requests:
    get:
      summary: 查詢下屬加班記錄
      description: |
        主管查詢直屬下屬的加班記錄，支援分頁、篩選功能
        
        **權限說明**：僅主管身份可使用此功能，只能查詢直屬下屬的加班記錄
        **預設排序**：依加班日期降序（overtimeDate DESC），最近的加班在最前面
      operationId: getSubordinatesOvertimeRequests
      tags:
        - Overtime Management
        - Manager Functions
      parameters:
        - name: managerId
          in: path
          required: true
          schema:
            type: integer
          description: 主管編號
          example: 1
        - name: agentId
          in: query
          required: false
          schema:
            type: integer
          description: 特定下屬編號（選填，可用於篩選特定下屬）
          example: 2
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, CANCELLED]
          description: 依狀態篩選（選填）
          example: "PENDING"
        - name: overtimeType
          in: query
          required: false
          schema:
            type: string
            enum: [WEEKDAY_OVERTIME, REST_DAY_OVERTIME, LEGAL_HOLIDAY_OVERTIME]
          description: 依加班類型篩選（選填）
          example: "WEEKDAY_OVERTIME"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 頁碼（預設為 1）
          example: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每頁筆數（預設 20，最大 100）
          example: 20
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
