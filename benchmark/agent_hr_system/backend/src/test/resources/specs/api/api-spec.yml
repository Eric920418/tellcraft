                        createdAt:
                          type: integer
                          format: int64
                          description: 建立時間（毫秒時間戳記，台灣時區 UTC+8）
                          example: 1730923800000
                        updatedAt:
                          type: integer
                          format: int64
                          description: 更新時間（毫秒時間戳記，台灣時區 UTC+8）
                          example: 1730923800000
                  total:
                    type: integer
                    description: 總筆數
                    example: 10
                  page:
                    type: integer
                    description: 當前頁碼
                    example: 1
                  pageSize:
                    type: integer
                    description: 每頁筆數
                    example: 20
        "401":
          description: 未授權（JWT Token 無效或過期）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 錯誤訊息
                    example: "未授權，請重新登入"
        "403":
