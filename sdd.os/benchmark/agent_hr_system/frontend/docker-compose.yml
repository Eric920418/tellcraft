services:
  # 前端服務
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # 構建時傳入環境變數
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        - NEXT_PUBLIC_ENABLE_MOCK=${NEXT_PUBLIC_ENABLE_MOCK:-true}
    container_name: agent-hr-frontend
    ports:
      - "3000:3000"
    environment:
      # 運行時環境變數
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      - NEXT_PUBLIC_ENABLE_MOCK=${NEXT_PUBLIC_ENABLE_MOCK:-true}
    restart: unless-stopped
    networks:
      - agent-hr-network

  # 如果你有後端服務，可以在這裡添加
  # backend:
  #   image: your-backend-image:latest
  #   container_name: agent-hr-backend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=prod
  #   restart: unless-stopped
  #   networks:
  #     - agent-hr-network

networks:
  agent-hr-network:
    driver: bridge
