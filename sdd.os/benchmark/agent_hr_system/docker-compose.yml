# ============================================
# 特務人資系統 - Docker Compose 配置
# 支援開發和生產環境
# 測試使用 H2，運行使用 MySQL
# ============================================

name: agent-hr-system

services:
  # ============================================
  # 資料庫服務 (MySQL)
  # ============================================
  db:
    image: mysql:8.0
    container_name: agent-hr-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-agent_hr}
      MYSQL_USER: ${DB_USER:-agent_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-agent_pass}
      TZ: Asia/Taipei
      LANG: C.UTF-8
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - agent-hr-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 後端服務
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: agent-hr-backend
    environment:
      # Spring 配置
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      # 資料庫配置
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-agent_hr}?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-agent_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-agent_pass}
      # JPA 配置
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}
      # Server 配置
      SERVER_PORT: 8080
      # 時區
      TZ: Asia/Taipei
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agent-hr-network
    volumes:
      # 開發模式下掛載原始碼 (hot reload)
      - ${BACKEND_SRC_MOUNT:-/dev/null}:/app/src:cached
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # phpMyAdmin (MySQL 管理工具)
  # ============================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: agent-hr-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-agent_user}
      PMA_PASSWORD: ${DB_PASSWORD:-agent_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      UPLOAD_LIMIT: 50M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agent-hr-network
    restart: unless-stopped

  # ============================================
  # 前端服務
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        - NEXT_PUBLIC_ENABLE_MOCK=${NEXT_PUBLIC_ENABLE_MOCK:-false}
    container_name: agent-hr-frontend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8080}
      - NEXT_PUBLIC_ENABLE_MOCK=${NEXT_PUBLIC_ENABLE_MOCK:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - agent-hr-network
    volumes:
      # 開發模式下掛載原始碼 (hot reload)
      - ${FRONTEND_SRC_MOUNT:-/dev/null}:/app/src:cached
      - ${FRONTEND_PUBLIC_MOUNT:-/dev/null}:/app/public:cached
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  agent-hr-network:
    driver: bridge
    name: agent-hr-network

volumes:
  db_data:
    name: agent-hr-db-data
