# ISA (Instruction Set Architecture) 指令集定義
# 特務人資系統 - ISA-Level Feature File 可執行指令集

version: "1.0"
domain: "agent-hr-system"

instructions:
  
  # ---------- 資料準備指令 (Given) ----------
  
  - name: "準備一個{entity}, with table:"
    description: "在資料庫中插入測試資料（fixture）"
    context: "Given"
    syntax: "準備一個{entity}, with table:"
    parameters:
      entity:
        type: "string"
        description: "實體名稱（來自 entity_to_table_mapping.yml）"
        examples: ["特務", "打卡記錄", "請假申請", "加班申請"]
    datatable:
      required: true
      structure: "entity-based"
      headers:
        source: "schema.sql"
      values:
        types: ["literal", "variable", "time"]

  # ---------- 時間控制指令 (Given) ----------
  
  - name: "現在的時間是"
    description: "設定測試時的當前時間"
    context: "Given"
    syntax: "現在的時間是 \"{time_expression}\""
    parameters:
      time_expression:
        type: "string"
        description: "時間表達式（支援 @time() 語法）"
    datatable:
      required: false

  # ---------- API 呼叫指令 (When) ----------
  
  - name: "(UID=\"{userId}\") {api_summary}, call table:"
    description: "呼叫 API endpoint"
    context: "When"
    syntax: "(UID=\"{userId}\") {api_summary}, call table:"
    parameters:
      userId:
        type: "variable"
        description: "用戶 ID 變數（用於認證）"
        examples: ["$Agent001.id", "$Manager001.id"]
      api_summary:
        type: "string"
        description: "API 動作描述（來自 api-spec.yml 的 summary）"
        examples: ["打卡", "提交請假申請", "申請加班", "查詢下屬加班記錄", "審核加班申請"]
    datatable:
      required: true
      structure: "api-based"
      headers:
        source: "api-spec.yml requestBody"

  # ---------- API 回應驗證指令 (Then) ----------
  
  - name: "{api_summary}({status_code})回應, with table:"
    description: "驗證 API 回應的 payload 內容（包含 API summary 和 status code）"
    context: "Then"
    syntax: "{api_summary}({status_code})回應, with table:"
    datatable:
      required: true
      structure: "api-response-based"
      headers:
        source: "api-spec.yml responses[{status_code}]"

  - name: "{api_summary}({status_code})回應為, with JSON:"
    description: "驗證 API 回應為 JSON 格式（包含 API summary 和 status code）"
    context: "Then"
    syntax: "{api_summary}({status_code})回應為, with JSON:"
    datatable:
      required: false
      description: "使用 JSON DocString"

  - name: "回應, with table:"
    description: "驗證 API 回應的 payload 內容（舊語法，建議使用新語法）"
    context: "Then"
    syntax: "回應, with table:"
    datatable:
      required: true
      structure: "api-response-based"
      headers:
        source: "api-spec.yml responses[200]"

  - name: "回應為, with JSON:"
    description: "驗證 API 回應為 JSON 格式（舊語法，建議使用新語法）"
    context: "Then"
    syntax: "回應為, with JSON:"
    datatable:
      required: false
      description: "使用 JSON DocString"

  # ---------- 資料庫驗證指令 (Then) ----------
  
  - name: "應該存在一個{entity}, with table:"
    description: "從資料庫查詢並驗證實體存在"
    context: "Then"
    syntax: "應該存在一個{entity}, with table:"
    parameters:
      entity:
        type: "string"
        description: "實體名稱（來自 entity_to_table_mapping.yml）"
    datatable:
      required: true
      structure: "entity-based-validation"
      headers:
        source: "schema.sql"

  - name: "應該不存在一個{entity}, with table:"
    description: "從資料庫查詢並驗證實體不存在"
    context: "Then"
    syntax: "應該不存在一個{entity}, with table:"
    parameters:
      entity:
        type: "string"
        description: "實體名稱（來自 entity_to_table_mapping.yml）"
    datatable:
      required: true
      structure: "entity-based-validation"
      headers:
        source: "schema.sql"

  # ---------- 操作失敗驗證指令 (Then) ----------
  
  - name: "操作失敗"
    description: "驗證 API 呼叫失敗（HTTP 4xx）"
    context: "Then"
    syntax: "操作失敗"
    parameters: {}
    datatable:
      required: false

spec_sources:
  api_spec:
    path: "spec/api/api-spec.yml"
    format: "OpenAPI 3.0"
  
  entity_mapping:
    path: "spec/data/entity_to_table_mapping.yml"
    format: "YAML"
  
  database_schema:
    path: "spec/data/schema.sql"
    format: "SQL DDL"


