# Disable Spring Boot auto DataSource (manually configured by TestMultiDsConfig)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Schema initialization disabled (manually done in TestMultiDsConfig)
spring.sql.init.mode=never

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# JWT
jwt.secret=my-super-secret-key-for-todo-list-app-at-least-256-bits-long
jwt.expiration-ms=3600000
