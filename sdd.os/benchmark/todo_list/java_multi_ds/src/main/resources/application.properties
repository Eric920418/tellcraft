# Primary DataSource (MSSQL)
spring.datasource.primary.url=jdbc:sqlserver://localhost:1433;databaseName=tododb;encrypt=false
spring.datasource.primary.username=sa
spring.datasource.primary.password=YourStrong!Passw0rd
spring.datasource.primary.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Secondary DataSource (MSSQL)
spring.datasource.secondary.url=jdbc:sqlserver://localhost:1433;databaseName=tododb_secondary;encrypt=false
spring.datasource.secondary.username=sa
spring.datasource.secondary.password=YourStrong!Passw0rd
spring.datasource.secondary.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Disable Spring Boot auto DataSource (we configure manually in MultiDsConfig)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# JWT
jwt.secret=my-super-secret-key-for-todo-list-app-at-least-256-bits-long
jwt.expiration-ms=3600000
