[project]
name = "specformula-python"
version = "0.1.0"
description = "Python implementation of SpecFormula framework"
requires-python = ">=3.10"
dependencies = [
    "specformula-core",
    "specformula-behave",
    "specformula-bridge",
    "specformula-testcontainer",
]

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
specformula-core = { workspace = true }
specformula-behave = { workspace = true }
specformula-bridge = { workspace = true }
specformula-testcontainer = { workspace = true }

[dependency-groups]
dev = [
    "behave>=1.3.0",
    "pytest>=9.0.2",
    "ruff~=0.15.0",
]

[tool.uv]
override-dependencies = [
    "greenlet>=1.1.0",
    "pymssql>=2.2.7",
    "pymysql>=1",
]
