<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Dashboard - 極簡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-white text-slate-900 antialiased">
  <div class="min-h-dvh flex">
    <!-- Sidebar -->
    <aside class="w-64 border-r border-slate-200 p-6 hidden md:block">
      <div class="mb-8">
        <h1 class="text-xl font-semibold text-balance">Dashboard</h1>
      </div>
      <nav class="space-y-1">
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-slate-100 text-slate-900 font-medium">
          <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          總覽
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
          <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          分析
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
          <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          用戶
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
          <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          設定
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 lg:p-8">
      <!-- Header -->
      <header class="flex items-center justify-between mb-8">
        <div>
          <h2 class="text-2xl font-semibold text-balance">歡迎回來</h2>
          <p class="text-slate-500 text-pretty">這是您的業務概覽</p>
        </div>
        <button class="px-4 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2">
          新增項目
        </button>
      </header>

      <!-- Stats Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="p-6 border border-slate-200 rounded-xl">
          <p class="text-sm text-slate-500 mb-1">總收入</p>
          <p class="text-2xl font-semibold tabular-nums">$45,231</p>
          <p class="text-sm text-emerald-600 mt-2">+20.1% 較上月</p>
        </div>
        <div class="p-6 border border-slate-200 rounded-xl">
          <p class="text-sm text-slate-500 mb-1">訂閱數</p>
          <p class="text-2xl font-semibold tabular-nums">2,350</p>
          <p class="text-sm text-emerald-600 mt-2">+180 本月新增</p>
        </div>
        <div class="p-6 border border-slate-200 rounded-xl">
          <p class="text-sm text-slate-500 mb-1">活躍用戶</p>
          <p class="text-2xl font-semibold tabular-nums">12,234</p>
          <p class="text-sm text-emerald-600 mt-2">+573 本週</p>
        </div>
        <div class="p-6 border border-slate-200 rounded-xl">
          <p class="text-sm text-slate-500 mb-1">轉換率</p>
          <p class="text-2xl font-semibold tabular-nums">3.2%</p>
          <p class="text-sm text-slate-500 mt-2">穩定</p>
        </div>
      </div>

      <!-- Content Grid -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Chart Area -->
        <div class="lg:col-span-2 p-6 border border-slate-200 rounded-xl">
          <h3 class="font-semibold mb-4 text-balance">收入趨勢</h3>
          <div class="h-64 flex items-end gap-2">
            <div class="flex-1 bg-slate-100 rounded-t" style="height: 40%"></div>
            <div class="flex-1 bg-slate-100 rounded-t" style="height: 65%"></div>
            <div class="flex-1 bg-slate-100 rounded-t" style="height: 45%"></div>
            <div class="flex-1 bg-slate-100 rounded-t" style="height: 80%"></div>
            <div class="flex-1 bg-slate-100 rounded-t" style="height: 55%"></div>
            <div class="flex-1 bg-slate-100 rounded-t" style="height: 70%"></div>
            <div class="flex-1 bg-slate-900 rounded-t" style="height: 90%"></div>
          </div>
          <div class="flex justify-between mt-4 text-sm text-slate-500">
            <span>一月</span>
            <span>二月</span>
            <span>三月</span>
            <span>四月</span>
            <span>五月</span>
            <span>六月</span>
            <span>七月</span>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="p-6 border border-slate-200 rounded-xl">
          <h3 class="font-semibold mb-4 text-balance">最近活動</h3>
          <div class="space-y-4">
            <div class="flex items-center gap-3">
              <div class="size-10 bg-slate-100 rounded-full flex items-center justify-center text-sm font-medium">王</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate">王小明升級方案</p>
                <p class="text-xs text-slate-500">2 分鐘前</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <div class="size-10 bg-slate-100 rounded-full flex items-center justify-center text-sm font-medium">李</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate">李小華完成註冊</p>
                <p class="text-xs text-slate-500">5 分鐘前</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <div class="size-10 bg-slate-100 rounded-full flex items-center justify-center text-sm font-medium">張</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate">張大偉購買進階版</p>
                <p class="text-xs text-slate-500">12 分鐘前</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <div class="size-10 bg-slate-100 rounded-full flex items-center justify-center text-sm font-medium">陳</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate">陳小美提交反饋</p>
                <p class="text-xs text-slate-500">25 分鐘前</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
