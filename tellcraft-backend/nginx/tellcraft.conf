# Tellcraft Backend - Nginx 配置
# 複製到 /etc/nginx/sites-available/tellcraft 並創建符號鏈接到 sites-enabled
#
# 高併發 WebSocket 必做（在 /etc/nginx/nginx.conf）：
# - worker_processes auto;
# - worker_rlimit_nofile 200000;
# - events { worker_connections 16384; multi_accept on; }

# Upgrade Header 兼容（WebSocket / HTTP 共用）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 上游服務
upstream tellcraft_backend {
    server 127.0.0.1:3100;
    keepalive 256;
}

# HTTP → HTTPS 重定向（如有域名）
# server {
#     listen 80;
#     server_name api.tellcraft.com;
#     return 301 https://$server_name$request_uri;
# }

# 主服務器配置（使用 IP 直接訪問）
server {
    listen 80 reuseport backlog=65535;
    server_name 54.238.4.117;

    # 上傳檔案大小限制（multer 5MB + overhead）
    client_max_body_size 6m;

    # 日誌
    access_log /var/log/nginx/tellcraft_access.log;
    error_log /var/log/nginx/tellcraft_error.log;

    # Tellcraft API
    location /tellcraft/ {
        # 移除 /tellcraft 前綴
        rewrite ^/tellcraft(/.*)$ $1 break;

        proxy_pass http://tellcraft_backend;
        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 標準代理頭
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;

        # 超時設置（支持長連接）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s; # 24 小時（WebSocket）

        # 緩衝設置
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io 專用路由（確保 WebSocket 正常工作）
    location /tellcraft/socket.io/ {
        rewrite ^/tellcraft(/.*)$ $1 break;

        proxy_pass http://tellcraft_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;

        # WebSocket 必須的超時設置
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 上傳圖片靜態代理
    location /uploads/tellcraft/ {
        alias /var/www/uploads/tellcraft/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        autoindex off;

        # 只允許圖片副檔名
        location ~ \.(jpg|jpeg|png|webp|gif|svg)$ {
            # 允許
        }
        # 其他副檔名拒絕
        location ~ \.(?!jpg|jpeg|png|webp|gif|svg$) {
            return 403;
        }
    }

    # 健康檢查（不需要認證）
    location = /tellcraft/health {
        rewrite ^/tellcraft(/.*)$ $1 break;
        proxy_pass http://tellcraft_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

