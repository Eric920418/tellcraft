# Tellcraft Backend - Nginx 配置
# 部署位置：/etc/nginx/sites-available/tellcraft（並 ln -s 到 sites-enabled/）
#
# 兩個入口：
#   1. https://api.tellcraft.com   ← 主入口（前端 NEXT_PUBLIC_VPS_API_URL 應指向這裡）
#   2. http://<VPS_IP>:8080         ← 過渡期向後相容（舊前端配置直連 IP）
#
# 首次部署 SSL（VPS 上跑一次）：
#   sudo apt-get install -y python3-certbot-nginx
#   sudo certbot --nginx -d api.tellcraft.com --redirect --agree-tos -m <email>
#   ↑ certbot 會自動為下方 server 區塊插入 listen 443 ssl + 證書路徑 + 80→443 redirect
#
# 高併發 WebSocket 必做（編輯 /etc/nginx/nginx.conf）：
#   - worker_processes auto;
#   - worker_rlimit_nofile 200000;
#   - events { worker_connections 16384; multi_accept on; }

# Upgrade Header 兼容（WebSocket / HTTP 共用）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 上游服務
upstream tellcraft_backend {
    server 127.0.0.1:3100;
    keepalive 256;
}

# ===========================================================================
# 主入口：api.tellcraft.com
# certbot --nginx 跑過後，會自動在此 server 區塊內補上 listen 443 ssl + ssl_*
# 並另外插入一個 listen 80 → 301 redirect 到 https 的 server
# ===========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.tellcraft.com;

    # Let's Encrypt HTTP-01 challenge（certbot --nginx 模式不會用到，保留以防手動模式）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 上傳檔案大小限制（multer 5MB + overhead）
    client_max_body_size 6m;

    access_log /var/log/nginx/api_tellcraft_access.log;
    error_log  /var/log/nginx/api_tellcraft_error.log;

    # Socket.io 專用（需 WebSocket header + 長連線超時）
    location /socket.io/ {
        proxy_pass http://tellcraft_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 上傳圖片靜態
    location /uploads/tellcraft/ {
        alias /var/www/uploads/tellcraft/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        autoindex off;
    }

    # 健康檢查
    location = /health {
        proxy_pass http://tellcraft_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 預設 API 路由
    location / {
        proxy_pass http://tellcraft_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_cache_bypass $http_upgrade;
    }
}

# ===========================================================================
# 過渡入口：http://<VPS_IP>:8080
# 給尚未切換到 api.tellcraft.com 的舊環境使用，前端切完即可移除整段
# ===========================================================================
server {
    listen 8080 reuseport backlog=65535;
    server_name _;

    client_max_body_size 6m;
    access_log /var/log/nginx/tellcraft_8080_access.log;
    error_log  /var/log/nginx/tellcraft_8080_error.log;

    location / {
        proxy_pass http://tellcraft_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /socket.io/ {
        proxy_pass http://tellcraft_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/tellcraft/ {
        alias /var/www/uploads/tellcraft/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        autoindex off;
    }
}
